name: CodeQL
on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language:
        - actions
        - javascript-typescript
        - python
        - rust
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - name: Fetch pinned CodeQL bundle
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_WORKSPACE/.github/scripts/ci-jobs.sh" codeql-bundle
    - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        tools: ${{ runner.temp }}/codeql-bundle-linux64.tar.zst
    - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
      with:
        category: /language:${{ matrix.language }}
