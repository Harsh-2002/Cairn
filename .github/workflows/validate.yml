name: Validation
on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      profile:
        required: true
        type: string
      base:
        required: false
        type: string
        default: ''
    outputs:
      results:
        description: Checked job results
        value: ${{ jobs.validation-result.outputs.results }}
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
jobs:
  policy:
    name: workflow policy
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - run: python3 tests/release_policy.py
    - run: python3 -m unittest discover -s tests -p test_ci.py -v
    - run: shellcheck -s bash .github/scripts/ci-jobs.sh
    - run: bash .github/scripts/ci-jobs.sh actionlint
  docs:
    name: documentation
    runs-on: ubuntu-24.04
    needs:
    - policy
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
        fetch-depth: 0
    - run: python3 .github/scripts/docs_check.py
      env:
        BASE_REVISION: ${{ inputs.base }}
  web-bundle:
    name: shared console bundle
    if: ${{ inputs.profile == 'full' }}
    needs:
    - policy
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.23.2
        cache: npm
        cache-dependency-path: web/package-lock.json
    - run: npm ci --prefix web
    - run: npm run lint --prefix web
    - run: npm run test:performance --prefix web
    - run: npm audit --prefix web --omit=dev --audit-level=moderate
    - run: npm audit --prefix web --audit-level=high
    - run: npm run build --prefix web
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: web-dist
        path: web/dist
        retention-days: 1
        if-no-files-found: error
  storage-lab:
    name: storage laboratory safety and driver regressions
    needs:
    - build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        build-web: 'false'
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cairn-bin
        path: target/debug
    - name: Test laboratory accounting and actual layer fixtures
      run: bash "$GITHUB_WORKSPACE/.github/scripts/ci-jobs.sh" storage-lab
    if: ${{ inputs.profile == 'full' }}
  build:
    name: build cairn (shared binary)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        web-artifact: web-dist
    - run: cargo build --bin cairn
    - run: strip target/debug/cairn
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: cairn-bin
        path: target/debug/cairn
        retention-days: 1
        if-no-files-found: error
    if: ${{ inputs.profile == 'full' }}
    needs:
    - web-bundle
  rust-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - name: Install pinned cargo-audit
      env:
        AUDIT_URL: https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz
        AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
      run: bash "$GITHUB_WORKSPACE/.github/scripts/ci-jobs.sh" rust-audit-1
    - run: bash "$GITHUB_WORKSPACE/.github/scripts/ci-jobs.sh" rust-audit-2
    if: ${{ inputs.profile == 'full' }}
    needs:
    - policy
  installer:
    name: installer lint + generation regressions
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - run: shellcheck -s sh install.sh tests/install.sh
    - run: sh tests/install.sh
    if: ${{ inputs.profile == 'full' }}
    needs:
    - policy
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        components: rustfmt, clippy
        web-artifact: web-dist
    - run: cargo fmt --all --check
    - run: cargo clippy --workspace --all-targets -- -D warnings
    - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    if: ${{ inputs.profile == 'full' }}
    needs:
    - web-bundle
  test:
    name: test (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
        - x86_64-unknown-linux-gnu
        - x86_64-unknown-linux-musl
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - name: Install musl tools
      if: endsWith(matrix.target, 'musl')
      run: sudo apt-get update && sudo apt-get install -y musl-tools=1.2.4-2
    - uses: ./.github/actions/setup
      with:
        targets: ${{ matrix.target }}
        web-artifact: web-dist
    - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e
      with:
        tool: cargo-nextest@0.9.140
        checksum: true
        fallback: none
    - name: Test
      env:
        TARGET: ${{ matrix.target }}
      run: bash "$GITHUB_WORKSPACE/.github/scripts/ci-jobs.sh" workspace-tests
    if: ${{ inputs.profile == 'full' }}
    needs:
    - web-bundle
  test-all-features:
    name: test (all features)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - name: Free disk space
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: false
        large-packages: false
    - uses: ./.github/actions/setup
      with:
        web-artifact: web-dist
    - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e
      with:
        tool: cargo-nextest@0.9.140
        checksum: true
        fallback: none
    - run: cargo nextest run --workspace --all-features
    if: ${{ inputs.profile == 'full' }}
    needs:
    - web-bundle
  conformance:
    name: boto3 conformance
    needs:
    - build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cairn-bin
        path: target/debug
    - run: chmod +x target/debug/cairn
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.13.14
    - run: python -m pip install --require-hashes -r .github/requirements/conformance.txt
    - name: Drive Cairn with the AWS SDK (real SigV4 + aws-chunked streaming, the F-5 path)
      run: BIN=target/debug/cairn PY=python3 bash conformance/run.sh
    if: ${{ inputs.profile == 'full' }}
  routing:
    name: routing fall-through guard
    needs:
    - build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cairn-bin
        path: target/debug
    - run: chmod +x target/debug/cairn
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.13.14
    - run: python -m pip install --require-hashes -r .github/requirements/conformance.txt
    - name: An unparseable bucket/key must never re-route to the bucket or root handler
      run: BIN=target/debug/cairn PY=python3 bash conformance/routing.sh
    if: ${{ inputs.profile == 'full' }}
  listing:
    name: listing / pagination / versioning semantics
    needs:
    - build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cairn-bin
        path: target/debug
    - run: chmod +x target/debug/cairn
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.13.14
    - run: python -m pip install --require-hashes -r .github/requirements/conformance.txt
    - name: Delimiter/CommonPrefixes, real token-fed pagination loops, delete markers + undelete
      run: BIN=target/debug/cairn PY=python3 bash conformance/listing.sh
    if: ${{ inputs.profile == 'full' }}
  multipart:
    name: multipart session-state error codes
    needs:
    - build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cairn-bin
        path: target/debug
    - run: chmod +x target/debug/cairn
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.13.14
    - run: python -m pip install --require-hashes -r .github/requirements/conformance.txt
    - name: "Low-level create/upload-part/complete \u2014 exact NoSuchUpload/InvalidPart/InvalidPartOrder/EntityTooSmall, and a terminating ListMultipartUploads loop"
      run: BIN=target/debug/cairn PY=python3 bash conformance/multipart.sh
    if: ${{ inputs.profile == 'full' }}
  objects:
    name: object payload / headers / range
    needs:
    - build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cairn-bin
        path: target/debug
    - run: chmod +x target/debug/cairn
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.13.14
    - run: python -m pip install --require-hashes -r .github/requirements/conformance.txt
    - name: System headers + aws-chunked normalization, copy directives, exact 206/416 ranges, encoded keys, DeleteObjects
      run: BIN=target/debug/cairn PY=python3 bash conformance/objects.sh
    if: ${{ inputs.profile == 'full' }}
  buckets:
    name: bucket surface + config subresources
    needs:
    - build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cairn-bin
        path: target/debug
    - run: chmod +x target/debug/cairn
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.13.14
    - run: python -m pip install --require-hashes -r .github/requirements/conformance.txt
    - name: Name validation, DeleteBucket 204/409/404, every subresource PUT->GET->DELETE (bucket survives), real CORS preflight
      run: BIN=target/debug/cairn PY=python3 bash conformance/buckets.sh
    if: ${{ inputs.profile == 'full' }}
  authz:
    name: tenant isolation + SigV4 / presigned / anonymous auth
    needs:
    - build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cairn-bin
        path: target/debug
    - run: chmod +x target/debug/cairn
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.13.14
    - run: python -m pip install --require-hashes -r .github/requirements/conformance.txt
    - name: Cross-tenant AccessDenied (before NoSuchKey), SigV4 failure modes, presigned expiry, Block Public Access
      run: BIN=target/debug/cairn PY=python3 bash conformance/authz.sh
    if: ${{ inputs.profile == 'full' }}
  lifecycle:
    name: lifecycle scanner enforcement
    needs:
    - build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cairn-bin
        path: target/debug
    - run: chmod +x target/debug/cairn
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.13.14
    - run: python -m pip install --require-hashes -r .github/requirements/conformance.txt
    - name: "Prove the scanner ACTS \u2014 expires only matching keys, stays in its bucket, ignores Disabled, delete-marker on versioned"
      run: BIN=target/debug/cairn PY=python3 bash conformance/lifecycle.sh
    if: ${{ inputs.profile == 'full' }}
  checksums:
    name: modern-SDK flexible checksums
    needs:
    - build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cairn-bin
        path: target/debug
    - run: chmod +x target/debug/cairn
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.13.14
    - run: python -m pip install --require-hashes -r .github/requirements/conformance.txt
    - name: Assert checksums are computed, stored, and echoed on PUT/GET/HEAD (ARCH 21.1)
      run: BIN=target/debug/cairn PY=python3 bash conformance/checksums.sh
    if: ${{ inputs.profile == 'full' }}
  encryption:
    name: real-SDK SSE object-body conformance
    needs:
    - build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cairn-bin
        path: target/debug
    - run: chmod +x target/debug/cairn
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.13.14
    - run: python -m pip install --require-hashes -r .github/requirements/conformance.txt
    - name: Assert SSE-S3/aws:kms/at-rest/mandatory/multipart wire contract + on-disk ciphertext + fail-closed (ARCH 27)
      run: BIN=target/debug/cairn PY=python3 bash conformance/encryption.sh
    if: ${{ inputs.profile == 'full' }}
  scrub:
    name: integrity scrub (bit-rot detection)
    needs:
    - build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cairn-bin
        path: target/debug
    - run: chmod +x target/debug/cairn
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.13.14
    - run: python -m pip install --require-hashes -r .github/requirements/conformance.txt
    - name: Corrupt a blob (plaintext / at-rest / SSE-S3 / compressed); assert the scrub detects each
      run: BIN=target/debug/cairn PY=python3 bash conformance/scrub.sh
    if: ${{ inputs.profile == 'full' }}
  object-lock:
    name: object lock / WORM
    needs:
    - build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cairn-bin
        path: target/debug
    - run: chmod +x target/debug/cairn
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.13.14
    - run: python -m pip install --require-hashes -r .github/requirements/conformance.txt
    - name: COMPLIANCE/GOVERNANCE retention + legal hold enforced via the AWS SDK
      run: BIN=target/debug/cairn PY=python3 bash conformance/object_lock.sh
    if: ${{ inputs.profile == 'full' }}
  notifications:
    name: webhook event notifications
    needs:
    - build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cairn-bin
        path: target/debug
    - run: chmod +x target/debug/cairn
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.13.14
    - run: python -m pip install --require-hashes -r .github/requirements/conformance.txt
    - name: Event-notification delivery + HMAC signing (management web console listener on)
      run: BIN=target/debug/cairn PY=python3 bash conformance/notifications.sh
    if: ${{ inputs.profile == 'full' }}
  sts:
    name: STS temporary credentials
    needs:
    - build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cairn-bin
        path: target/debug
    - run: chmod +x target/debug/cairn
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.13.14
    - run: python -m pip install --require-hashes -r .github/requirements/conformance.txt
    - name: Mint + enforce scoped session credentials over a real SDK (management web console listener on)
      run: BIN=target/debug/cairn PY=python3 bash conformance/sts.sh
    if: ${{ inputs.profile == 'full' }}
  sts-xml:
    name: STS XML wire surface (AssumeRole + GetSessionToken)
    needs:
    - build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cairn-bin
        path: target/debug
    - run: chmod +x target/debug/cairn
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.13.14
    - run: python -m pip install --require-hashes -r .github/requirements/conformance.txt
    - name: A real SDK STS client mints + consumes creds via the AWS-STS XML form POST
      run: BIN=target/debug/cairn PY=python3 bash conformance/sts_xml.sh
    if: ${{ inputs.profile == 'full' }}
  console-session:
    name: console session-cookie auth
    needs:
    - build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cairn-bin
        path: target/debug
