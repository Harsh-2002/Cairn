name: Extended checks
on:
  schedule:
  - cron: 17 3 * * 1
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: false
jobs:
  codeql:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/codeql.yml
    with:
      revision: ${{ github.sha }}
    permissions:
      contents: read
      security-events: write
      actions: read
