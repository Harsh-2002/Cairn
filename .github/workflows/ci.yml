name: CI
on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      revision: ${{ steps.plan.outputs.revision }}
      tree: ${{ steps.plan.outputs.tree }}
      profile: ${{ steps.plan.outputs.profile }}
      reused: ${{ steps.plan.outputs.reused }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      head_repository_id: ${{ steps.plan.outputs.head_repository_id }}
      pr_number: ${{ steps.plan.outputs.pr_number }}
      source: ${{ steps.plan.outputs.source }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - id: plan
      run: python3 .github/scripts/ci.py plan
      env:
        GH_TOKEN: ${{ github.token }}
  validate:
    needs:
    - plan
    if: ${{ needs.plan.outputs.reused != 'true' }}
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      actions: write
      security-events: write
    with:
      revision: ${{ needs.plan.outputs.revision }}
      profile: ${{ needs.plan.outputs.profile }}
      base: ${{ needs.plan.outputs.base_sha }}
  required:
    name: required
    if: ${{ always() }}
    needs:
    - plan
    - validate
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - run: python3 .github/scripts/ci.py record
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ci-receipt-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-receipt.json
        retention-days: 90
        if-no-files-found: error
