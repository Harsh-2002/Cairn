<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Cairn mark: a single filled rounded square, matching the in-app logo
       (console sidebar + login) and the console favicon. Monochrome, foreground-
       coloured in both themes so it reads on light and dark tabs alike. -->
  <style>
    rect { fill: #0a0a0a; }
    @media (prefers-color-scheme: dark) { rect { fill: #fafafa; } }
  </style>
  <rect x="3" y="3" width="26" height="26" rx="6.5" />
</svg>
