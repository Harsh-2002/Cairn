[package]
name = "cairn-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Authentication for Cairn: SigV4 (header + presigned + streaming), Bearer, dev chain."

[lints]
workspace = true

[features]
# Compiles the development authentication bypass into the build (loopback-guarded). Release
# builds omit this feature so the bypass cannot ship.
dev-auth = []

[dependencies]
cairn-types.workspace = true
cairn-authz.workspace = true
async-trait.workspace = true
tracing.workspace = true
# SHA-256 of request payloads (the per-chunk streaming signatures) runs on aws-lc-rs: it selects
# SHA-NI/AVX at runtime, while the pure-Rust backend processes a 1 MiB body at well under 100 MB/s
# and was 45% of all server CPU on a streaming-upload benchmark.
aws-lc-rs.workspace = true
sha2.workspace = true
sha1.workspace = true
hmac.workspace = true
hex.workspace = true
subtle.workspace = true
zeroize.workspace = true

[dev-dependencies]
cairn-types = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
